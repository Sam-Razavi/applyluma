name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres for the tests that set TEST_DATABASE_URL. The rest of the
    # suite uses fakes, which never compile SQL, so query bugs only show up here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applyluma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff lint
        run: ruff check app/

      - name: mypy type-check
        run: mypy app/

      - name: Migrate the test database
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/applyluma_test
          SECRET_KEY: ci-test-secret-key-not-used-in-production

      - name: pytest
        run: pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/applyluma_test

  frontend:
    name: Frontend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  extension:
    name: Extension — validate manifest and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applyluma-extension

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and build store zip
        run: ./scripts/package.sh

      - name: Upload store zip
        uses: actions/upload-artifact@v4
        with:
          name: applyluma-extension
          path: applyluma-extension/dist/*.zip
